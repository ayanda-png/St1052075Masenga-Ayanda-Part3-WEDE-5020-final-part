<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
    <title>Donation Page</title>
</head>

<body>

    <h1>Make a Donation</h1>

    <p>
        Your donation can help us and you would make a huge impact on our business
        Every contribution, no matter how small, is greatly appreciated.
        It will help fund for our cleaning materials
    </p>

    <h2>Choose Donation Amount</h2>

    <form>

        <label>
            <input type="radio" name="amount" value="50">
            R50
        </label>

        <label>
            <input type="radio" name="amount" value="100">
            R100
        </label>

        <label>
            <input type="radio" name="amount" value="250">
            R250
        </label>

        <label>
            <input type="radio" name="amount" value="500">
            R500
        </label>

        <br><br>

        <label for="custom">Other Amount:</label>
        <input type="number" id="custom" name="custom" placeholder="Enter amount">

        <h2>Your Details</h2>

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name">

        <br><br>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email">

        <br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="4" cols="40"
                  placeholder="Leave a message (optional)"></textarea>

        <br><br>

        <button type="submit">Donate Now</button>

    </form>
 
<script src="js/clean.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

</body>
</html>
